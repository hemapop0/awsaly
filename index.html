<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>أوصلي</title>

    <link rel="stylesheet" href="CSS/style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">أوصلي <span>🚗</span></div>
      <!-- <p>مساعدتك على الطريق تبدأ من هنا</p> -->
    </header>

    <main class="container">
      <section class="hero">
        <div class="hero-text">
          <!-- <span class="tag">خدمة المساعدة على الطريق</span> -->
          <h1>في مشكلة في العربية؟</h1>
        </div>

        <div class="hero-icon">🚘</div>
      </section>

      <form id="requestForm">

    <!-- بيانات السيارة -->
    <section class="form-section">
        <h2>🚗 بيانات السيارة</h2>
        <h3>Chevrolet Cruze</h3>
        <h3>وه ---- ٥٧٩٤</h3>
    </section>

    <!-- اختيار المشكلة -->
    <section class="form-section">
        <h2>⚠️ إيه المشكلة اللي حصلت؟</h2>

        <p class="section-description">
            اختار المشكلة اللي بتواجهك:
        </p>

        <div class="problems">

            <label class="problem-card">
                <input type="radio" name="problem"
                    value="العربية قافلة عليا" required>
                <span>🔒</span>
                <strong>العربية قافلة عليا</strong>
            </label>

            <label class="problem-card">
                <input type="radio" name="problem"
                    value="نور العربية شغال">
                <span>💡</span>
                <strong>نور العربية شغال</strong>
            </label>

            <label class="problem-card">
                <input type="radio" name="problem"
                    value="السنتر لوك مفتوح">
                <span>🚪</span>
                <strong>السنتر لوك مفتوح</strong>
            </label>

            <label class="problem-card">
                <input type="radio" name="problem"
                    value="العربية اتخبطت">
                <span>💥</span>
                <strong>العربية اتخبطت</strong>
            </label>

            <label class="problem-card">
                <input type="radio" name="problem"
                    value="مشكلة أخرى">
                <span>❓</span>
                <strong>مشكلة أخرى</strong>
            </label>

        </div>
    </section>

    <!-- تفاصيل المشكلة -->
    <section class="form-section">
        <h2>📝 تفاصيل المشكلة</h2>

        <div class="form-group">
            <label for="description">
                اشرح المشكلة بالتفصيل
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="اكتب تفاصيل المشكلة هنا..."
               
            ></textarea>
        </div>
    </section>

    <!-- رفع الصور -->
    <section class="form-section">
        <h2>📷 صور المشكلة</h2>

        <p class="section-description">
            ارفع صورة أو أكثر لتوضيح المشكلة.
        </p>

        <label for="images" class="upload-area">
            <span>📸</span>
            <strong>اضغط لاختيار الصور</strong>
            <small>يمكنك اختيار أكثر من صورة</small>
        </label>

        <input
            type="file"
            id="images"
            accept="image/*"
            multiple
            hidden
        >

        <div id="imagePreview" class="image-preview"></div>
    </section>

    <!-- زر إرسال الطلب -->
    <section class="form-section">
        <button type="button" id="sendWhatsApp">
            🟢 إرسال البلاغ عبر WhatsApp
        </button>
    </section>

</form>
      <!-- </section> -->
    </main>

    <footer>
      <p>أوصلي © 2026  🚗</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
